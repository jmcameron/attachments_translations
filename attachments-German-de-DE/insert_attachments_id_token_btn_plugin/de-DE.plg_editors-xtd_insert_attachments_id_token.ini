; NOTE TO TRANSLATORS:
; Do not translate the '{attachments}' part of any of the right-hand
; strings below!  It must appear exactly as '{attachments}' in the
; article/parent text in order for the substitutions to work correctly in
; 'custom placement' mode.!

INSERT_ATTACHMENTS_ID_TOKEN="Token {attachments id=xxx} einfügen"
INSERT_ATTACHMENTS_ID_TOKEN_DESCRIPTION="Platziere den Cursor an der Stelle, an der die Anhänge-Liste im Frontend angezeigt werden soll, und klicke dann auf diese Schaltfläche. Dadurch wird das {attachments}-Token eingefügt, das von der Option „Benutzerdefinierte Platzierung“ verwendet wird. Zusätzlich wird etwas HTML eingefügt, um das Token auszublenden, wenn keine Anhänge-Liste angezeigt wird."
ATTACH_INSERT_ATTACHMENTS_ID_TOKEN_BUTTON_PLUGIN_DESCRIPTION="Das Insert-Attachments-Token-Plugin fügt eine Schaltfläche hinzu, mit der beim Bearbeiten von Artikeln oder Kategorien ein benutzerdefiniertes {attachments id=xxx}-Token eingefügt werden kann."
ATTACH_INSERT_ATTACHMENTS_ID_TOKEN_PLUGIN_ATTACHMENTS_FRAMEWORK_NOT_AVAILABLE="Das Insert-Attachments-Id-Token-Plugin erfordert, dass das Attachments-Framework-Plugin installiert und aktiviert ist."
